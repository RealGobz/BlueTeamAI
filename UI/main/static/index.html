<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triagent</title>
  <link rel="icon" type="image/svg+xml" href="/brand/triagent-icon.svg">
  <link rel="stylesheet" href="/brand/theme.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Left Panel: Thread Navigation -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <picture class="brand-lockup">
          <source media="(prefers-color-scheme: light)" srcset="/brand/triagent-lockup-light.svg">
          <img src="/brand/triagent-lockup-dark.svg" alt="Triagent" width="158" height="36">
        </picture>
        <span id="active-runs-badge" class="badge-active-runs">0 active</span>
      </div>
      <div class="sidebar-search-area">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="7" cy="7" r="5" />
            <path d="M11 11l4 4" />
          </svg>
          <input type="text" id="thread-search-input" class="thread-search-input" placeholder="Search alerts... (/)" autocomplete="off" spellcheck="false" aria-label="Search alerts">
          <kbd class="kbd-shortcut">/</kbd>
        </div>
        <div id="filter-pills" class="filter-pills" role="tablist" aria-label="Filter alerts">
          <button type="button" class="filter-pill active" data-filter="all">All <span class="pill-count" id="count-all"></span></button>
          <button type="button" class="filter-pill" data-filter="waiting">Needs decision <span class="pill-count" id="count-waiting"></span></button>
          <button type="button" class="filter-pill" data-filter="attack">Attack <span class="pill-count" id="count-attack"></span></button>
          <button type="button" class="filter-pill" data-filter="safe">Safe <span class="pill-count" id="count-safe"></span></button>
        </div>
      </div>
      <div id="thread-list" class="thread-list" role="navigation" aria-label="Alert Threads">
        <div class="empty-state">Loading threads...</div>
      </div>
    </aside>

    <!-- Main Content Panel: Thread Timeline & Chat -->
    <main id="main-panel" class="main-panel">
      <!-- No Thread Selected State -->
      <div id="no-thread-selected" class="empty-view">
        <div class="empty-view-content">
          <picture class="brand-lockup-empty">
            <source media="(prefers-color-scheme: light)" srcset="/brand/triagent-lockup-light.svg">
            <img src="/brand/triagent-lockup-dark.svg" alt="Triagent" width="180" height="41">
          </picture>
          <h2 id="empty-state-title" class="empty-state-title">Watching. Nothing needs you right now.</h2>
          <p class="empty-state-punchline">What if every alert came with an answer?</p>
          <div class="shortcuts-hint">
            <span class="hint-item"><kbd class="kbd-key">&uarr;</kbd> <kbd class="kbd-key">&darr;</kbd> Navigate</span>
            <span class="hint-item"><kbd class="kbd-key">/</kbd> Search</span>
            <span class="hint-item"><kbd class="kbd-key">Esc</kbd> Clear</span>
          </div>
        </div>
      </div>

      <!-- Active Thread View -->
      <div id="thread-view" class="thread-view hidden">
        <!-- Thread Header -->
        <header id="thread-header" class="thread-header">
          <div class="header-main">
            <div class="header-title-row">
              <span id="header-level" class="level-chip"></span>
              <h2 id="header-title" class="header-title"></h2>
              <span id="header-status" class="st-chip"></span>
            </div>
            <div class="header-meta-row">
              <span id="header-host" class="meta-item"></span>
              <span id="header-user" class="meta-item"></span>
              <span id="header-time" class="meta-item"></span>
              <span id="header-thread-id" class="meta-item meta-muted"></span>
            </div>
          </div>
        </header>

        <!-- Timeline Container -->
        <div id="timeline-container" class="timeline-container">
          <div class="timeline-toolbar">
            <div class="timeline-toolbar-left">
              <span class="toolbar-label">Timeline</span>
              <span id="timeline-count-badge" class="timeline-count-badge">0 items</span>
            </div>
            <div class="timeline-tabs" role="tablist" aria-label="Timeline Filters">
              <button type="button" class="timeline-tab active" data-tab="all">All</button>
              <button type="button" class="timeline-tab" data-tab="tools">Tools</button>
              <button type="button" class="timeline-tab" data-tab="decisions">Decisions</button>
              <button type="button" class="timeline-tab" data-tab="chat">Chat</button>
            </div>
          </div>
          <div id="timeline-items" class="timeline-items">
            <!-- Rendered dynamically by app.js -->
          </div>
        </div>

        <!-- Input Bar -->
        <footer id="input-footer" class="input-footer">
          <div id="input-status-banner" class="input-status-banner hidden">
            <span id="input-status-text"></span>
            <a id="hitl-link" class="hitl-link hidden" target="_blank" rel="noopener noreferrer">Open HITL Approval Console &rarr;</a>
          </div>
          <form id="chat-form" class="chat-form">
            <textarea
              id="chat-input"
              class="chat-input"
              rows="1"
              maxlength="2000"
              placeholder="Ask a question about this investigation (Enter to send, Shift+Enter for new line)..."
            ></textarea>
            <button id="chat-send-btn" type="submit" class="chat-send-btn">Send</button>
          </form>
        </footer>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
